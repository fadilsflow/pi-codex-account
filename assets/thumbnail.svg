<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">pi-codex-account thumbnail</title>
  <desc id="desc">A polished terminal-style preview for a Pi extension that switches OpenAI Codex accounts and shows usage.</desc>
  <defs>
