      <stop offset="0.48" stop-color="#151828" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#06070B"/>
    </radialGradient>
    <radialGradient id="bg-b" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(135 540) rotate(-24) scale(710 400)">
      <stop stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="0.52" stop-color="#0B1020" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="118" y1="94" x2="1011" y2="574" gradientUnits="userSpaceOnUse">
